name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify workspace identity
        run: python scripts/qa_identity.py
      - name: Install build frontend
        run: python -m pip install build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify package contents
        run: python scripts/verify_package_contents.py dist/agentnative-*.whl
      - name: Install wheel into clean environment
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install dist/*.whl
          .ci-venv/bin/python -m pip check
          .ci-venv/bin/agentnative --help
          .ci-venv/bin/agentnative scan examples/agent-native-business --json --output report.json
          .ci-venv/bin/agentnative scan evals/adversarial/credentials/bearer.html --json --output credential-report.json
      - name: Compile source, tests, and evals
        run: PYTHONPATH=src python -m compileall -q src tests evals
      - name: Install declared development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run pytest verification
        run: PYTHONPATH=.:src python -m pytest --import-mode=importlib -q tests
      - name: Run deterministic tests
        run: PYTHONPATH=src:. python -m unittest discover -s tests -v
      - name: Run Phase 2B mutation controls
        run: PYTHONPATH=src python scripts/run_phase2b_mutations.py
      - name: Run Phase 2C mutation controls
        run: PYTHONPATH=src python scripts/run_phase2c_mutations.py
      - name: Run Phase 3 mutation controls
        run: PYTHONPATH=src python scripts/run_phase3_mutations.py
      - name: Run Retail productization tests
        run: PYTHONPATH=src python -m pytest --import-mode=importlib -q tests/retail
      - name: Smoke Retail product workflow
        run: |
          for project in direct-ready platform-retailer human-handoff-retailer unsafe-retailer; do
            agentnative retail validate examples/retail/$project
            agentnative retail recommend examples/retail/$project
            agentnative retail blueprint examples/retail/$project --output /tmp/$project-blueprint.md
            agentnative retail evidence examples/retail/$project --output /tmp/$project-evidence.json
          done
      - name: Generate RC1 builder evidence manifest
        run: PYTHONPATH=src python scripts/run_phase3_rc1_evidence.py --output V3/evidence/phase3_rc1_builder_manifest.json
      - name: Upload RC1 builder evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase3-rc1-builder-evidence
          path: V3/evidence/phase3_rc1_builder_manifest.json
