name: phase3b-gate2-external-verification

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download builder bundle from the completed run
        uses: actions/download-artifact@v4
        with:
          name: phase3b-gate2-builder-bundle
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: .
      - name: Install verifier dependencies
        run: python -m pip install -e ".[dev]"
      - name: Bind manifest to the completed builder run and artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          artifact_json="$(gh api "repos/${SOURCE_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "phase3b-gate2-builder-bundle")')"
          artifact_id="$(printf '%s' "$artifact_json" | python -c 'import json, sys; print(json.load(sys.stdin)["id"])')"
          artifact_digest="$(printf '%s' "$artifact_json" | python -c 'import json, sys; print(json.load(sys.stdin)["digest"])')"
          artifact_url="$(printf '%s' "$artifact_json" | python -c 'import json, sys; print(json.load(sys.stdin)["archive_download_url"])')"
          python scripts/finalize_phase3b_gate2_manifest.py \
            V3/evidence/gate2/phase3b_gate2_builder_manifest.json \
            --run-id "$SOURCE_RUN_ID" \
            --repository "$SOURCE_REPOSITORY" \
            --artifact-id "$artifact_id" \
            --artifact-digest "$artifact_digest" \
            --artifact-url "$artifact_url"
      - name: Verify completed run and GitHub artifact externally
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify_phase3b_evidence.py V3/evidence/gate2/phase3b_gate2_builder_manifest.json
      - name: Record external verification result
        run: |
          mkdir -p /tmp/phase3b-gate2-result
          python scripts/verify_phase3b_evidence.py V3/evidence/gate2/phase3b_gate2_builder_manifest.json > /tmp/phase3b-gate2-result/external_verification.json
      - name: Upload independent-run verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase3b-gate2-external-verification
          path: |
            /tmp/phase3b-gate2-result/external_verification.json
            V3/evidence/gate2/phase3b_gate2_builder_manifest.json
