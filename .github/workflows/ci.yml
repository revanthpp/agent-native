name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify workspace identity
        run: python scripts/qa_identity.py
      - name: Install build and development dependencies
        run: |
          python -m pip install build
          python -m pip install -e ".[dev]"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify package contents
        run: python scripts/verify_package_contents.py dist/agentnative-*.whl
      - name: Run ordered Gate 2 builder sequence
        run: |
          python scripts/run_phase3b_gate2_evidence.py \
            --wheel "$(ls dist/agentnative-*.whl | head -n 1)"
      - name: Verify Gate 2 manifest locally
        run: python scripts/verify_phase3b_evidence.py V3/evidence/gate2/phase3b_gate2_builder_manifest.json --offline
      - name: Run full regression suite
        run: |
          python -m unittest discover -s tests -v
          python -m pytest --import-mode=importlib -q tests
      - name: Upload Gate 2 builder bundle
        id: gate2-bundle
        uses: actions/upload-artifact@v4
        with:
          name: phase3b-gate2-builder-bundle
          path: |
            V3/evidence/gate2/**
            V3/PHASE_3B_GATE2_PROOF_REMEDIATION_BUILD_REPORT.md
            V3/PHASE_3B_CLOSURE_REMEDIATION_BUILD_REPORT.md
            V3/REQUIREMENTS_TRACEABILITY.md
            dist/*.whl
          if-no-files-found: error
      - name: Bind manifest to completed run and uploaded artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/finalize_phase3b_gate2_manifest.py \
            V3/evidence/gate2/phase3b_gate2_builder_manifest.json \
            --artifact-id "${{ steps.gate2-bundle.outputs.artifact-id }}" \
            --artifact-digest "${{ steps.gate2-bundle.outputs.artifact-digest }}" \
            --artifact-url "${{ steps.gate2-bundle.outputs.artifact-url }}"
      - name: Upload finalized Gate 2 manifest
        uses: actions/upload-artifact@v4
        with:
          name: phase3b-gate2-final-manifest
          path: V3/evidence/gate2/phase3b_gate2_builder_manifest.json
          if-no-files-found: error
