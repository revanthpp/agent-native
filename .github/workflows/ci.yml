name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify workspace identity
        run: python scripts/qa_identity.py
      - name: Install build frontend
        run: python -m pip install build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install wheel into clean environment
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install dist/*.whl
          .ci-venv/bin/python -m pip check
          .ci-venv/bin/agentnative --help
          .ci-venv/bin/agentnative scan examples/agent-native-business --json --output report.json
          .ci-venv/bin/agentnative scan evals/adversarial/credentials/bearer.html --json --output credential-report.json
      - name: Compile source, tests, and evals
        run: PYTHONPATH=src python -m compileall -q src tests evals
      - name: Run deterministic tests
        run: PYTHONPATH=src:. python -m unittest discover -s tests -v
